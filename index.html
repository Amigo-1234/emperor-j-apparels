<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emperor J Apparels</title>

    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>
<body>

    <!-- HEADER -->

    <header class="header">

        <nav class="navbar">

            <!-- Logo -->

            <a href="#" class="logo">
                <img
                    src="assets/images/logo.png"
                    alt="Emperor J Apparels Logo"
                >
            </a>

            <!-- Desktop Navigation -->

            <ul class="desktop-nav">

                <li><a href="#">Home</a></li>

                <li><a href="#">About</a></li>

                <li><a href="#">Services</a></li>

                <li><a href="#">Gallery</a></li>

                <li><a href="#">Contact</a></li>

            </ul>

            <!-- Desktop CTA -->

            <a href="#" class="desktop-btn">
                Book Consultation
            </a>

            <!-- Mobile Menu Button -->

            <button class="menu-btn">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="28"
                    height="28"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M4 6h16M4 12h16M4 18h16"/>

                </svg>

            </button>

        </nav>

    </header>

    <!-- MOBILE MENU -->

    <aside class="mobile-menu">

        <div class="menu-top">

            <img
                src="assets/images/logo.png"
                alt="Logo">

            <button class="close-btn">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="28"
                    height="28"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M6 18L18 6M6 6l12 12"/>

                </svg>

            </button>

        </div>

        <ul class="mobile-links">

            <li><a href="#">Home</a></li>

            <li><a href="#">About</a></li>

            <li><a href="#">Services</a></li>

            <li><a href="#">Gallery</a></li>

            <li><a href="#">Contact</a></li>

        </ul>

        <a href="#" class="consultation-btn">
            Book Consultation
        </a>

    </aside>

    <script src="assets/js/script.js"></script>

</body>
</html>
